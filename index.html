<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebNusa — Website &amp; Promo untuk UMKM Indonesia</title>
<meta name="description" content="WebNusa membantu UMKM tampil di internet, jualan lebih. Website cepat, rapi, murah. Landing page, promo konten, lead generation.">
<meta name="keywords" content="website UMKM, landing page, promo konten, lead generation, WebNusa">
<meta name="author" content="WebNusa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --teal:#2C7A7B;
    --teal-dark:#1F5C5E;
    --gold:#F2CC8F;
    --gold-light:#FBF3DF;
    --ink:#212B36;
    --ink-soft:#4A5A66;
    --bg:#F7FAF9;
    --white:#FFFFFF;
    --border:#E3EEEE;
    --radius:14px;
    --shadow:0 8px 30px rgba(0,0,0,.07);
    --font-head:'Poppins',sans-serif;
    --font-body:'Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--bg);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ul{list-style:none}
  img{max-width:100;display:block}
  .container{max-width:1140px;margin:0 auto;padding:0 24px}

  /* Nav */
  nav{
    position:sticky;top:0;z-index:100;
    background:rgba(44,122,123,.96);
    backdrop-filter:blur(12px);
    padding:14px 0;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;width:100}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:24px;color:#fff}
  .logo-icon{width:38px;height:38px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center}
  .logo-icon i{color:var(--teal-dark);font-size:20px}
  .logo small{color:#BFD6D7;font-size:12px;font-weight:400;letter-spacing:1px}
  .nav-links{display:flex;gap:22px;font-size:14px;font-weight:500;color:rgba(255,255,255,.85)}
  .nav-links a:hover{color:#fff}
  .nav-actions{display:flex;gap:12px}
  .btn-primary{
    background:var(--gold);color:var(--teal-dark);
    padding:12px 22px;border-radius:50px;font-weight:600;font-size:14px;transition:.25s;
  }
  .btn-primary:hover{background:#E2B76F}
  .nav-cta i{margin-left:6px}
  .hamburger{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}

  /* Hero */
  .hero{
    padding:70px 0 90px;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(242,204,143,.25), transparent 60%),
      linear-gradient(160deg, #1F5C5E 0%, #2C7A7B 55%, #1F5C5E 100%);
    color:#fff;
  }
  .hero .container{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
  .hero-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    padding:8px 16px;border-radius:50px;font-size:13px;font-weight:500;
    letter-spacing:.5px;
  }
  .hero h1{
    font-family:var(--font-head);
    font-size:52px;font-weight:800;line-height:1.15;margin:20px 0 22px;
    max-width:600px;
  }
  .hero h1 span{color:var(--gold)}
  .hero p{font-size:17px;color:rgba(255,255,255,.82);max-width:520px;margin-bottom:28px}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap}
  .hero-cta .btn-white{
    background:#fff;color:var(--teal-dark);
    padding:14px 26px;border-radius:50px;font-weight:600;font-size:15px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .hero-cta .btn-white:hover{background:#FBF3DF}
  .hero-cta .btn-outline{
    background:transparent;border:1.5px solid rgba(255,255,255,.4);
    padding:14px 26px;border-radius:50px;font-weight:600;font-size:15px;color:#fff;
  }
  .hero-cta .btn-outline:hover{border-color:#fff;background:rgba(255,255,255,.1)}
  .hero-visual{max-width:480px}
  .hero-card{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    border-radius:16px;padding:24px;backdrop-filter:blur(6px);
  }
  .hero-card h3{font-size:19px;margin-bottom:12px}
  .hero-card .stat{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);padding:10px 0;color:rgba(255,255,255,.8)}
  .hero-card .stat:last-child{border-bottom:0}
  .hero-card .stat b{color:#fff;font-size:20px}
  .hero-dots{display:flex;gap:10px;margin-top:24px;justify-content:flex-end}
  .hero-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4)}

  /* Services */
  .section{padding:80px 0;background:#fff}
  .section-label{
    display:inline-block;font-size:13px;font-weight:600;letter-spacing:2px;color:var(--teal);
    text-transform:uppercase;padding:6px 14px;border-radius:50px;background:var(--gold-light);
  }
  .section-title{
    font-family:var(--font-head);font-size:32px;font-weight:800;margin:12px 0 6px;
    line-height:1.2;
  }
  .section-sub{color:var(--ink-soft);max-width:620px;margin-bottom:40px}

  .services-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;
  }
  .service-card{
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
    padding:32px;transition:.3s;
  }
  .service-card:hover{background:#fff;border-color:var(--teal);box-shadow:var(--shadow)}
  .service-icon{
    width:60px;height:60px;border-radius:12px;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:20px;
  }
  .service-card h3{font-family:var(--font-head);font-size:20px;margin-bottom:12px}
  .service-card p{color:var(--ink-soft);font-size:15px}

  /* Works */
  .works-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;
  }
  .work-card{
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;transition:.3s;cursor:pointer;
  }
  .work-card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
  .work-img{
    height:180px;background:linear-gradient(135deg,var(--teal) 0%, var(--teal-dark) 100%);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:52px;
  }
  .work-card .content{padding:22px}
  .work-card .content h3{font-family:var(--font-head);font-size:19px;margin-bottom:8px}
  .work-card .content p{color:var(--ink-soft);font-size:14px}

  /* About */
  .about-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;
  }
  .about-text p{color:var(--ink-soft);margin-bottom:18px}
  .about-text .highlight{color:var(--teal);font-weight:600}
  .about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
  .stat-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-align:center}
  .stat-box .num{font-family:var(--font-head);font-size:34px;font-weight:800;color:var(--teal)}
  .stat-box .label{font-size:14px;color:var(--ink-soft)}

  /* Contact */
  .contact{background:var(--bg);border-top:1px solid var(--border)}
  .contact .container{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:start}
  .contact-info h3{font-family:var(--font-head);font-size:28px;margin-bottom:12px}
  .contact-info p{color:var(--ink-soft);margin-bottom:20px}
  .contact-links{display:flex;gap:16px;flex-wrap:wrap}
  .contact-link{
    flex:1 1 200px;background:var(--white);border:1px solid var(--border);
    padding:20px;border-radius:var(--radius);text-align:left;transition:.25s;
  }
  .contact-link:hover{border-color:var(--teal);box-shadow:var(--shadow)}
  .contact-link i{color:var(--teal);margin-bottom:10px;font-size:20px}
  .contact-link span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  .contact-link small{display:block;color:var(--ink-soft);font-size:13px}
  .contact-form{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .contact-form .form-group{margin-bottom:18px}
  .contact-form label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;display:block}
  .contact-form input,.contact-form textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;font-family:var(--font-body);font-size:15px;
  }
  .contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(44,122,123,.15)}
  .contact-form textarea{min-height:120px;resize:vertical}
  .send-btn{
    background:var(--teal);color:#fff;border:none;padding:14px 26px;border-radius:50px;
    font-weight:600;font-size:15px;cursor:pointer;transition:.25s;width:100%;
  }
  .send-btn:hover{background:var(--teal-dark)}
  .form-success{display:none;text-align:center;padding:10px 0}
  .form-success.show{display:block;color:#1F7A1F;font-weight:600;font-size:16px}

  /* Footer */
  footer{
    background:var(--teal-dark);color:#fff;padding:50px 0 24px;
  }
  .footer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px}
  .footer-brand p{color:rgba(255,255,255,.7);font-size:14px;margin-top:12px}
  .footer-col h4{font-size:16px;margin-bottom:14px}
  .footer-col ul li{margin-bottom:9px;font-size:14px;color:rgba(255,255,255,.75)}
  .footer-col ul li i{margin-right:8px;color:var(--gold)}
  .footer-col ul li a:hover{color:#fff}
  .footer-bottom{
    border-top:1px solid rgba(255,255,255,.12);margin-top:40px;
    display:flex;justify-content:space-between;align-items:center;
    padding-top:20px;font-size:13px;color:rgba(255,255,255,.6);
  }

  /* Misc */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s ease}
  .reveal.visible{opacity:1;transform:none}
  .mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
  .mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
  @media (max-width:820px){
    .nav-links{display:none}
    .nav-cta .btn-primary{padding:10px 18px;font-size:13px}
    .hero .container{grid-template-columns:1fr;gap:32px;padding:50px 0 60px}
    .hero h1{font-size:36px}
    .about-grid{grid-template-columns:1fr;gap:32px}
    .about-stats{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:520px){
    .about-stats{grid-template-columns:1fr}
    .hero-cta .btn-white,.hero-cta .btn-outline{padding:12px 20px;font-size:14px}
    .section-title{font-size:26px}
  }
/* ===== Print / PDF ===== */
@media print{
  body{
    background:#fff !important;
    font-size:13px;
  }
  nav{
    background:#fff !important;
    color:#000 !important;
    border-bottom:2px solid #ccc !important;
  }
  nav .logo small{color:#000 !important}
  nav .nav-links{color:#000 !important}
  nav .nav-links a:hover{color:#000 !important}
  nav .btn-primary,.hero,.section:nth-child(2),.contact{background:#fff !important; color:#000 !important}
  .hero-dots,.hero-visual{display:none !important}
  .hero{
    background:#fff !important;
    color:#000 !important;
    border-bottom:1px solid #ccc;
    padding-bottom:24px;
  }
  .hero h1{font-size:28px !important}
  .hero h1 span{color:#000 !important}
  .hero p{color:#000 !important}
  .hero p b{color:#000 !important}
  .hero .section-label{
    background:#f2cc8f !important;
    color:#000 !important;
    border-color:#000 !important;
  }
  .section-label{
    background:#f2cc8f !important;
    color:#000 !important;
    border-color:#000 !important;
  }
  .service-card,.work-card,.stat-box,.contact-form,.contact-link{
    background:#fff !important;
    border-color:#bbb !important;
    box-shadow:none !important;
  }
  .service-card h3,.work-card .content h3,.contact-info h3,.footer-col h4{
    color:#000 !important;
  }
  .service-card p,.contact-info p,.work-card .content p,.footer-brand p,.footer-col ul li{
    color:#000 !important;
  }
  .contact-form input,.contact-form textarea,.contact-form button{
    border-color:#000 !important;
  }
  .contact-form button{background:#000 !important; color:#fff !important}
  .contact-form .form-success{
    color:#000 !important;
    background:#e9f7e9 !important;
    border:1px solid #bbddbb !important;
  }
  .footer{
    color:#000 !important;
  }
  .footer .logo small{color:#000 !important}
  .footer-brand p,.footer-col ul li,.footer-bottom{color:#000 !important}
  .footer-brand p .footer-brand p a{color:#000 !important}
  .footer-bottom{
    border-top:1px solid #ccc;
  }
  /* Hanya satu halaman hero + konten utama */
  .hero .container{max-width:100%}
  .reveal{opacity:1 !important; transform:none !important}
  *{box-shadow:none !important}
  a{color:#000}
}
</head>
<body>

<!-- NAV -->
<nav>
  <div class="container nav-inner">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-globe"></i></div>

<!-- HERO -->
<header class="hero" id="home">
  <div class="container">

<!-- LAYANAN -->
<section class="section" id="layanan">
  <div class="container">
    <div class="text-center" style="max-width:700px;margin:0 auto">
      <span class="section-label">Layanan</span>
      <h2 class="section-title">Yang bisa WebNusa bantu pasar</h2>
      <p class="section-sub">Dari cabang kecil yang ingin terlihat profesional, sampai UMKM yang suka jualan online. Semua kita desain ulang bersama.</p>

      </div>
      <div class="service-card reveal">
        <div class="service-icon"><i class="fas fa-bullhorn"></i></div>

        <p>Laman penawaran promosi, diskon, atau event yang dirancang menghadap ke konversi, bukan sekadar foto.</p>

      <div class="service-card reveal">
        <div class="service-icon"><i class="fas fa-image"></i></div>
        <h3>Promo Konten</h3>

      </div>
      <div class="service-card reveal">
        <div class="service-icon"><i class="fas fa-paper-plane"></i></div>
        <h3>Lead Generation</h3>
        <p>Email outreach ke pelanggan potensial yang mencari produk/kegiatan kamu, siap dibantu jalankan.</p>
      </div>
    </div>
  </div>
</section>

<!-- PROFIL -->
<section class="section" id="profil" style="background:var(--bg)">
  <div class="container">
    <div class="about-grid">
      <div class="about-text reveal">
        <span class="section-label">Profil</span>
        <h2 class="section-title">Kami adalah tim kecil yang teresti UMKM.</h2>
        <p>Kami percaya, sebuah bisnis kecil tidak perlu punya website mahal atau rumit. Yang mereka butuhkan adalah <span class="highlight">tayangan yang jelas, mudah diakses, dan bisa diandalkan pelanggan.</span></p>

          <div class="stat-box">

          <div class="stat-box">

          </div>

      </div>

          <h3>Kenapa WebNusa?</h3>
          <ul style="margin-top:12px">

            <li style="margin-bottom:0;color:var(--ink-soft)"><i class="fas fa-check text-teal" style="color:var(--teal);margin-right:8px"></i> Support sederhana</li>

        </div>
      </div>
    </div>
  </div>
</section>

<!-- KONTAK -->
<section class="contact" id="kontak">
  <div class="container">
    <div class="text-center" style="max-width:700px;margin:0 auto 40px">
      <span class="section-label">Kontak</span>
      <h2 class="section-title">Mau tampil di internet?</h2>
      <p class="section-sub">Kirimkan pesan singkat, nanti kita bahas kan kebutuhan website UMKM kamu. Kami balas dalam 1x24 jam.</p>

    <div class="contact-grid" style="display:grid;gap:24px">

            <input type="text" id="name" placeholder="Nama kamu" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="email@contoh.com" required>

            <label for="company">Nama UMKM / perusahaan</label>

          </div>
          <div class="form-group">
            <label for="message">Pesan / jenis website yang kamu cari</label>
            <textarea id="message" placeholder="Contoh: ingin website katalog, atau landing page promo..."></textarea>
          </div>
          <button type="submit" class="send-btn">Kirim pesan <i class="fas fa-paper-plane"></i></button>
        </form>
      </div>
      <div class="contact-info reveal">
        <h3>Hubungi langsung</h3>
        <p>Kami akan bantu pilih jenis website sesuai kebutuhan, tanpa tekanan, dan harga pasti.</p>
        <div class="contact-links">
          <a class="contact-link" href="https://wa.me/6281234567890" target="_blank">
            <i class="fab fa-whatsapp"></i>
            <span>WhatsApp</span>

<script>
  // Mobile nav
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.querySelector('nav .nav-links');
  hamburger.addEventListener('click', () => {
    navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
    hamburger.innerHTML = navLinks.style.display === 'flex' ? '<i class="fas fa-bars"></i>' : '<i class="fas fa-times"></i>';
  });
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const target = document.querySelector(a.getAttribute('href'));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({behavior:'smooth'});
        if (navLinks.style.display === 'flex') navLinks.style.display = 'none';
      }
    });
  });

  // Reveal on scroll
  const reveals = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, {threshold:0.15});
  reveals.forEach(el => obs.observe(el));

  // Active nav link
  const sections = document.querySelectorAll('section');
  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(s => {
      const top = s.getBoundingClientRect().top;
      if (top < 120) current = s.getAttribute('id');
    });
    document.querySelectorAll('nav .nav-links a').forEach(a => {
      a.classList.remove('active');
      if (a.getAttribute('href') === '#' + current) a.classList.add('active');
    });
  });

  // Contact form
  const form = document.getElementById('contact-form');
  const success = document.getElementById('form-success');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const btn = form.querySelector('.send-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
    setTimeout(() => {
      form.reset();
      success.classList.add('show');
      btn.disabled = false;
      btn.innerHTML = 'Kirim pesan <i class="fas fa-paper-plane"></i>';
      setTimeout(() => success.classList.remove('show'), 5000);
    }, 1200);
  });
</script>
